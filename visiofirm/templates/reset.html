{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="auth-page-container vf-reset-page">
    <div class="auth-card">
        <div class="vf-auth-heading">
            <span class="vf-auth-icon"><i class="fa-solid fa-key"></i></span>
            <h1>Reset password</h1>
            <p>Enter your account details and choose a new password.</p>
        </div>
        <form method="POST" action="{{ url_for('auth.reset_password') }}">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" class="form-control" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="password_confirm">Confirm New Password</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-control" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary vf-auth-submit">Reset password</button>
        </form>
        <p class="vf-auth-footer">Remember your password? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
