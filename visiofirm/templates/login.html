{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block breadcrumb %}
<a href="/" class="breadcrumb-link"><i class="fa-solid fa-house"></i> Home</a>
<span class="breadcrumb-separator"><i class="fa-solid fa-chevron-right"></i></span>
<span class="breadcrumb-current">Sign In</span>
{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <img src="/static/img/VisioFirm_logo.png" alt="VisioFirm" class="auth-logo">
            <h2>Welcome to VisioFirm</h2>
            <p class="auth-subtitle">AI-powered computer vision annotation tool</p>
        </div>

        <form method="post" action="/auth/login" class="auth-form">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <div class="input-icon-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="identifier" name="identifier" placeholder="Enter username or email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/auth/register">Sign Up</a></p>
            <p><a href="/auth/reset_password" class="auth-muted-link">Forgot Password?</a></p>
        </div>
    </div>
</div>

<style>
    .auth-page-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
        min-height: 100%;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-hover);
        border-radius: 16px;
        padding: 36px 32px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-logo {
        height: 48px;
        width: 48px;
        object-fit: contain;
        margin-bottom: 14px;
    }

    .auth-header h2 {
        font-size: 1.45rem;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 6px;
        letter-spacing: -0.01em;
    }

    .auth-subtitle {
        font-size: 0.86rem;
        color: var(--text-light);
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .auth-form .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .auth-form label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-color);
    }

    .input-icon-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon-wrapper .input-icon {
        position: absolute;
        left: 12px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .input-icon-wrapper input {
        width: 100%;
        padding: 10px 14px 10px 38px;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-color);
        font-size: 0.9rem;
        outline: none;
        transition: var(--transition);
    }

    .input-icon-wrapper input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px var(--primary-alpha);
    }

    .auth-submit-btn {
        margin-top: 8px;
        padding: 11px 16px;
        background: var(--primary-color);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
        box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }

    .auth-submit-btn:hover {
        background: var(--primary-hover);
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.45);
        transform: translateY(-1px);
    }

    .auth-footer {
        margin-top: 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-light);
    }

    .auth-footer a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    .auth-muted-link {
        color: var(--text-muted) !important;
        font-weight: 500 !important;
    }
</style>
{% endblock %}
